name: Build

on:
  push:
    branches: [main, master]
    paths:
      - 'eclipse-bridge/**'
      - 'mcp-server/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'eclipse-bridge/**'
      - 'mcp-server/**'
  workflow_dispatch:

jobs:
  eclipse-bridge:
    name: Build Eclipse bundle (Tycho)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Tycho
        env:
          MAVEN_OPTS: >-
            -Djdk.xml.maxGeneralEntitySizeLimit=0
            -Djdk.xml.totalEntitySizeLimit=0
            -Djdk.xml.entityExpansionLimit=0
            -Djdk.xml.elementAttributeLimit=0
            -Djdk.xml.maxOccurLimit=0
            -Djdk.xml.maxXMLNameLimit=0
        run: mvn -f eclipse-bridge/releng/pom.xml -B -ntp clean verify

      - name: Upload bundle JAR
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-bridge-jar
          path: |
            eclipse-bridge/releng/com.example.s32ds.agent.repository/target/repository/plugins/com.example.s32ds.agent.bridge_*.jar
            eclipse-bridge/releng/com.example.s32ds.agent.repository/target/com.example.s32ds.agent.repository-*.zip

  mcp-server:
    name: Test Python MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install server with dev extras
        run: |
          pip install -e "mcp-server[dev]"

      - name: Run tests
        run: pytest mcp-server/tests -v
